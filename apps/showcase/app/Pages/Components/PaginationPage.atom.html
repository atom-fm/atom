<ShowcasePageHeader title="Pagination" description="Pagination renders a small window of page links and keeps the current page in the URL." badge="Primitive" />

<Stack gap="md">
    <ComponentExample title="URL backed pagination" description="The page reads ?page= and passes the current value to Pagination.">
        <Stack gap="sm">
            <Panel title="Current page">
                <Inline gap="sm" align="center">
                    <Badge variant="info">Page {{ $this->page }}</Badge>
                    <span>Showing results for page {{ $this->page }} of {{ $this->total }}.</span>
                </Inline>
            </Panel>

            <Pagination label="Results pages" :page="$this->page" :total="$this->total" :href="'/components/pagination?page={page}&compactPage=' . $this->compactPage" navigate preserve-state preserve-scroll />
        </Stack>
    </ComponentExample>

    <ComponentExample title="Action backed pagination" description="Pagination can render buttons that update page state with atom:action.">
        <Stack gap="sm">
            <Panel title="Local page">
                <Inline gap="sm" align="center">
                    <Badge variant="success">Page {{ $this->localPage }}</Badge>
                    <span>This page value lives in #[State] and does not change the URL.</span>
                </Inline>
            </Panel>

            <Pagination label="Local results pages" :page="$this->localPage" :total="$this->total" action="setLocalPage({page})" />
        </Stack>
    </ComponentExample>

    <ComponentExample title="Compact window" description="The window property controls how many numeric links are shown.">
        <Pagination label="Compact page links" :page="$this->compactPage" :total="$this->compactTotal" window="3" :href="'/components/pagination?page=' . $this->page . '&compactPage={page}'" navigate preserve-state preserve-scroll />
    </ComponentExample>
</Stack>
