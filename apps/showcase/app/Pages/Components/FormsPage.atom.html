<ShowcasePageHeader title="Forms" description="Form components can bind directly to page state or receive a model from the parent form." badge="Model binding" />

<Stack gap="md">
    <ComponentExample
        title="Form model"
        description="The form passes its model into child fields, so each field can read values without prop drilling."
    >
        <Form submit="submit" :model="$this->form">
            <ValidationSummary title="Please fix these fields" only="title,summary" />

            <Toast>
                <Toast.Actions>
                    <Button size="sm" variant="ghost" atom:action="clearFlash">Dismiss</Button>
                </Toast.Actions>
            </Toast>

            <HiddenField name="categoryId" />

            <FormSection title="Content" description="Fields inside a form can be grouped without custom layout CSS.">
                <TextField label="Title" name="title" help="Use a concise title that will fit in table rows." maxlength="80" />

                <TextField label="Summary" name="summary" help="Shown in cards, previews, and search results." maxlength="160" />
            </FormSection>

            <FormSection title="Publishing">
                <FormRow>
                    <SelectField
                        label="Category"
                        name="categoryId"
                        help="The selected category is hydrated into the form model."
                        optionValue="id"
                        optionText="name"
                        :options="$this->categories"
                    />

                    <CheckField id="form-published" label="Published" name="published" help="Unchecked articles stay as drafts." />
                </FormRow>

                <RadioField
                    label="Visibility"
                    name="visibility"
                    orientation="horizontal"
                    help="Choose who can discover this article."
                    :options="$this->visibilityOptions"
                />

                <SwitchField label="Feature on home page" name="featured" help="Featured articles appear in the primary feed." />
            </FormSection>

            <FormActions>
                <Button type="submit">Submit</Button>
                <Button type="button" variant="ghost">Cancel</Button>
            </FormActions>
        </Form>
    </ComponentExample>

    <ComponentExample
        title="Input utilities"
        description="Adornments compose with raw controls, while password and file fields retain the same labels, help text, and validation behavior as other fields."
    >
        <Stack gap="sm">
            <Field label="Website" name="website" help="Prefixes and suffixes can contain text, icons, or other compact content.">
                <InputGroup>
                    <InputGroup.Prefix>https://</InputGroup.Prefix>
                    <TextInput name="website" placeholder="example" />
                    <InputGroup.Suffix>.com</InputGroup.Suffix>
                </InputGroup>
            </Field>

            <FormRow>
                <PasswordField
                    label="Password"
                    name="password"
                    autocomplete="new-password"
                    help="Use the reveal control to verify the entered value."
                />

                <FileField
                    label="Attachment"
                    name="attachment"
                    accept=".pdf,image/*"
                    help="PDF or image files."
                />
            </FormRow>
        </Stack>
    </ComponentExample>

    <ComponentExample
        title="Field states"
        description="Native input attributes cover required, read-only, disabled, and placeholder states without component-specific APIs."
    >
        <Stack gap="sm">
            <FormRow>
                <TextField label="Page title" name="pageTitle" required />
                <TextField label="Generated slug" name="slug" value="component-story" readonly />
            </FormRow>

            <TextAreaField
                id="standalone-summary"
                label="Notes"
                name="summary"
                help="This field reads directly from a page property."
                placeholder="Add an internal note"
            />

            <FormRow>
                <TextField label="Owner" name="owner" value="Framework team" disabled />
                <SelectField
                    label="Archived visibility"
                    name="archivedVisibility"
                    value="team"
                    :options="$this->visibilityOptions"
                    disabled
                />
            </FormRow>

            <Inline gap="lg">
                <CheckField id="standalone-enabled" label="Enabled" name="published" />
                <SwitchField id="standalone-pinned" label="Pinned" name="published" />
                <CheckField id="standalone-disabled" label="Unavailable" name="unavailable" disabled />
            </Inline>
        </Stack>
    </ComponentExample>
</Stack>
