name: Publish packages

on:
    push:
        branches:
            - master
        tags:
            - "v*"
    workflow_dispatch:
        inputs:
            verify_packagist_hooks:
                description: Send a push to each newly extracted package even if its files are unchanged
                type: boolean
                default: false

permissions:
    contents: read

concurrency:
    group: publish-packages
    cancel-in-progress: false

jobs:
    publish:
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - name: Check out monorepo
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.4"
                  extensions: pdo_sqlite
                  coverage: none
                  tools: composer:v2

            - name: Configure publisher identity
              run: |
                  git config --global user.name "atom-fm package publisher"
                  git config --global user.email "github-actions[bot]@users.noreply.github.com"

            - name: Sync library package repositories
              env:
                  PACKAGE_SPLIT_TOKEN: ${{ secrets.PACKAGE_SPLIT_TOKEN }}
                  VERIFY_PACKAGIST_HOOKS: ${{ inputs.verify_packagist_hooks }}
              run: |
                  for package in sql orm validation view di profiler mail console database framework components; do
                      target="$RUNNER_TEMP/$package"
                      git clone "https://x-access-token:${PACKAGE_SPLIT_TOKEN}@github.com/atom-fm/$package.git" "$target"
                      rsync -a --delete \
                          --exclude='.git/' \
                          --exclude='vendor/' \
                          --exclude='resource/cache/' \
                          --exclude='.phpunit.result.cache' \
                          --exclude='composer.lock' \
                          "packages/$package/" "$target/"

                      (
                          cd "$target"
                          rm -f composer.lock
                          composer config --unset repositories
                          composer validate --strict
                          git add --all
                          if ! git diff --cached --quiet; then
                              git commit -m "Sync $package from atom-fm/atom@${GITHUB_SHA::7}"
                              git push origin HEAD:master
                          elif [ "$VERIFY_PACKAGIST_HOOKS" = true ] && [ "$GITHUB_REF" = refs/heads/master ]; then
                              case "$package" in
                                  validation|view|di|profiler|mail|console|database)
                                      git commit --allow-empty -m "Verify Packagist webhook from atom-fm/atom@${GITHUB_SHA::7}"
                                      git push origin HEAD:master
                                      ;;
                              esac
                          fi
                          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$package" = framework ] && ! git show-ref --verify --quiet "refs/tags/$GITHUB_REF_NAME"; then
                              git tag "$GITHUB_REF_NAME"
                              git push origin "refs/tags/$GITHUB_REF_NAME"
                          fi
                      )
                  done

            - name: Publish starter
              env:
                  PACKAGE_SPLIT_TOKEN: ${{ secrets.PACKAGE_SPLIT_TOKEN }}
              run: |
                  target="$RUNNER_TEMP/starter"
                  git clone "https://x-access-token:${PACKAGE_SPLIT_TOKEN}@github.com/atom-fm/starter.git" "$target"
                  rsync -a --delete \
                      --exclude='.git/' \
                      --exclude='.env' \
                      --exclude='vendor/' \
                      --exclude='storage/cache/' \
                      --exclude='storage/*.sqlite' \
                      --exclude='storage/*.lock' \
                      apps/starter/ "$target/"
                  cd "$target"
                  mv composer.dist.json composer.json
                  composer update --no-interaction --no-progress
                  git add --all
                  if ! git diff --cached --quiet; then
                      git commit -m "Sync starter from atom-fm/atom@${GITHUB_SHA::7}"
                      git push origin HEAD:master
                  fi
                  if [ "$GITHUB_REF_TYPE" = "tag" ]; then
                      git tag "$GITHUB_REF_NAME"
                      git push origin "refs/tags/$GITHUB_REF_NAME"
                  fi

            - name: Publish Lucide
              env:
                  PACKAGE_SPLIT_TOKEN: ${{ secrets.PACKAGE_SPLIT_TOKEN }}
              run: |
                  target="$RUNNER_TEMP/lucide"
                  git clone "https://x-access-token:${PACKAGE_SPLIT_TOKEN}@github.com/atom-fm/lucide.git" "$target"
                  rsync -a --delete \
                      --exclude='.git/' \
                      --exclude='vendor/' \
                      --exclude='.phpunit.cache/' \
                      --exclude='composer.lock' \
                      packages/lucide/ "$target/"
                  cd "$target"
                  git rm -r --ignore-unmatch vendor
                  rm -rf vendor
                  mv composer.dist.json composer.json
                  rm -f composer.lock
                  composer validate --strict
                  git add --all
                  if ! git diff --cached --quiet; then
                      git commit -m "Sync Lucide from atom-fm/atom@${GITHUB_SHA::7}"
                      git push origin HEAD:master
                  fi
                  if [ "$GITHUB_REF_TYPE" = "tag" ]; then
                      git tag "$GITHUB_REF_NAME"
                      git push origin "refs/tags/$GITHUB_REF_NAME"
                  fi
